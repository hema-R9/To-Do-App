<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مهامي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>مهامي</h1>
      <p id="counter" class="counter"></p>
    </header>

    <form id="task-form" class="task-form">
      <input type="hidden" id="task-id">
      <input id="title" type="text" placeholder="عنوان المهمة" maxlength="120" required>
      <textarea id="description" placeholder="وصف (اختياري)" rows="2"></textarea>
      <div class="form-actions">
        <button type="submit" id="submit-btn" class="btn primary">Add Task</button>
        <button type="button" id="cancel-btn" class="btn" hidden>إلغاء</button>
      </div>
    </form>

    <p id="message" class="message" role="alert" hidden></p>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden>مفيش مهام لسه. ضيفي أول مهمة من النموذج اللي فوق.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
